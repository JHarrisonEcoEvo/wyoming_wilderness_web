<!DOCTYPE html>
<html lang="en">
<head>
  <script>if(localStorage.getItem('wyw-theme')==='retro')document.documentElement.classList.add('retro');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ printf "css/modern.css?v=%s" (md5 (readFile "static/css/modern.css")) | relURL }}">
  <link rel="stylesheet" href="{{ printf "css/retro.css?v=%s" (md5 (readFile "static/css/retro.css")) | relURL }}">
  {{ block "extrahead" . }}{{ end }}
</head>
<body>
  {{ partial "nav.html" . }}
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
<script>
(function () {
  var cssLink = document.querySelector('link[rel="stylesheet"]');
  var sitePath = cssLink ? cssLink.getAttribute('href').replace(/\/css\/modern\.css.*$/, '') : '';

  // Hero cover image
  if (window.heroCoverData && window.heroCoverData.length) {
    var covers = window.heroCoverData.filter(function(c) { return c.url; });
    if (covers.length) {
      var pick = covers[Math.floor(Math.random() * covers.length)];
      var banner = document.querySelector('.site-banner');
      if (banner) {
        banner.style.backgroundImage = 'url(' + pick.url + ')';
        var credit = document.getElementById('hero-photo-credit');
        var creditLink = document.getElementById('hero-photo-link');
        if (credit && creditLink) {
          creditLink.href = pick.link;
          creditLink.textContent = pick.title;
          credit.style.display = 'block';
        }
      }
    }
  }

  // Dropdown menus (top nav + homepage)
  var wrappers = document.querySelectorAll('.location-menu-wrapper, .nav-dropdown');
  function closeAllMenus() {
    wrappers.forEach(function (w) {
      w.classList.remove('open');
      var b = w.querySelector('.location-menu-btn, .nav-dropdown-btn');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
  }
  wrappers.forEach(function (wrapper) {
    var btn = wrapper.querySelector('.location-menu-btn, .nav-dropdown-btn');
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var isOpen = wrapper.classList.contains('open');
      closeAllMenus();
      if (!isOpen) {
        wrapper.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });
  document.addEventListener('click', closeAllMenus);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllMenus(); });

  // "more below" hint: hide once the list is scrolled to the end (or if it fits)
  document.querySelectorAll('.nav-dropdown-panel, .location-menu-dropdown').forEach(function (panel) {
    if (!panel.querySelector('.menu-scroll-hint')) return;
    function sync() {
      var overflows = panel.scrollHeight - panel.clientHeight > 4;
      panel.classList.toggle('no-overflow', !overflows);
      panel.classList.toggle('scrolled-to-end',
        overflows && panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 4);
    }
    panel.addEventListener('scroll', sync);
    window.addEventListener('resize', sync);
    var btn = panel.parentNode.querySelector('.nav-dropdown-btn, .location-menu-btn');
    if (btn) btn.addEventListener('click', function () { setTimeout(sync, 0); });
    sync();
  });

  // Theme toggle
  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    if (document.documentElement.classList.contains('retro')) {
      toggle.textContent = 'Go Modern';
    }
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      var isRetro = document.documentElement.classList.toggle('retro');
      localStorage.setItem('wyw-theme', isRetro ? 'retro' : 'modern');
      toggle.textContent = isRetro ? 'Go Modern' : 'Go to the 1990s';
    });
  }

  // Photo gallery
  document.querySelectorAll('.photo-gallery').forEach(function (gallery) {
    var imgs = Array.from(gallery.querySelectorAll('img'));
    // Fix root-relative paths to include site base path
    imgs.forEach(function(img) {
      var src = img.getAttribute('src') || '';
      if (src.charAt(0) === '/' && src.indexOf(sitePath + '/') !== 0) {
        img.src = sitePath + src;
      }
    });
    if (imgs.length === 0) return;
    // Snapshot src/alt before clearing gallery DOM
    var imgData = imgs.map(function(img) { return { src: img.src, alt: img.alt }; });

    var current = 0;

    var slides = imgData.map(function (data, i) {
      var slide = document.createElement('div');
      slide.className = 'gallery-slide' + (i === 0 ? ' active' : '');
      var newImg = document.createElement('img');
      newImg.src = data.src;
      newImg.alt = data.alt;
      slide.appendChild(newImg);
      return slide;
    });

    var caption = document.createElement('div');
    caption.className = 'gallery-caption';
    caption.textContent = imgData[0].alt || '';

    var controls = document.createElement('div');
    controls.className = 'gallery-controls';

    var prev = document.createElement('button');
    prev.className = 'gallery-btn gallery-prev';
    prev.innerHTML = '&#9664; Prev';

    var counter = document.createElement('span');
    counter.className = 'gallery-counter';
    counter.textContent = '1 / ' + imgs.length;

    var next = document.createElement('button');
    next.className = 'gallery-btn gallery-next';
    next.innerHTML = 'Next &#9654;';

    controls.appendChild(prev);
    controls.appendChild(counter);
    controls.appendChild(next);

    function goTo(n) {
      slides[current].classList.remove('active');
      current = (n + imgs.length) % imgs.length;
      slides[current].classList.add('active');
      counter.textContent = (current + 1) + ' / ' + imgs.length;
      caption.textContent = imgData[current].alt || '';
    }

    prev.onclick = function () { goTo(current - 1); };
    next.onclick = function () { goTo(current + 1); };

    gallery.innerHTML = '';
    slides.forEach(function (s) { gallery.appendChild(s); });
    gallery.appendChild(caption);
    gallery.appendChild(controls);
  });
}());
</script>
</body>
</html>
